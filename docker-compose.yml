name: trial-verdict
x-app: &app
  build: ./backend
  environment:
    DATABASE_URL: mysql+pymysql://trial:${DB_PASSWORD:-trial_local_demo}@db:3306/trial
    REDIS_URL: redis://redis:6379/0
    JWT_SECRET: ${JWT_SECRET:-trial-demo-change-in-production-3104}
    SEED_DEMO: ${SEED_DEMO:-true}
  volumes: [artifacts:/artifacts]
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-trial-verdict}-db
    environment:
      MYSQL_DATABASE: trial
      MYSQL_USER: trial
      MYSQL_PASSWORD: ${DB_PASSWORD:-trial_local_demo}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-trial_local_demo}
    ports: ["${DB_PORT:-17703}:3306"]
    volumes: [dbdata:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, "mysql -h 127.0.0.1 -utrial -p$$MYSQL_PASSWORD -e 'SELECT 1' trial"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-trial-verdict}-redis
    command: [redis-server, --appendonly, "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    <<: *app
    container_name: ${COMPOSE_PROJECT_NAME:-trial-verdict}-backend
    ports: ["${BACKEND_PORT:-19203}:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 25
  worker:
    <<: *app
    container_name: ${COMPOSE_PROJECT_NAME:-trial-verdict}-worker
    command: [python, -m, src.worker]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import os,time; assert time.time()-os.path.getmtime('/tmp/heartbeat')<20"]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-trial-verdict}-frontend
    ports: ["${FRONTEND_PORT:-18203}:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  dbdata:
  redisdata:
  artifacts:
networks:
  default:
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-10.253.104.0/24}
